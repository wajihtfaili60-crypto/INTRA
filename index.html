<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Intra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<!-- ======================================================================
     Automatische Weiterleitung: Handy/iPad (Touch-Gerät) -> handyapp.html,
     PC/Laptop (Maus/Trackpad) -> intra.html. So funktioniert ein
     einziger Link für beide Ansichten - kein manuelles Umschalten nötig.
     ====================================================================== -->
<script>
  var istTouchGeraet = window.matchMedia('(pointer: coarse)').matches
    || /iPad|iPhone|iPod|Android|Mobile/i.test(navigator.userAgent);
  window.location.replace(istTouchGeraet ? 'handyapp.html' : 'intra.html');
</script>
<noscript>
  <p>JavaScript ist deaktiviert. Bitte wähle manuell:
    <a href="intra.html">Web-App (PC)</a> |
    <a href="handyapp.html">Handy-App</a>
  </p>
</noscript>
</body>
</html>
